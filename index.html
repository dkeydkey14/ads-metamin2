<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --emerald: #0b7a56;
      --emerald-deep: #065f46;
      --emerald-soft: #d1fae5;
      --gold: #c9a44a;
      --gold-bright: #e8d48b;
      --gold-deep: #9a7420;
      --ink: #14352c;
      --muted: #4d6b61;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a3a32;
      color: var(--ink);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 42%, rgba(0, 20, 16, 0.08) 0%, rgba(0, 18, 14, 0.38) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 2px;
      border-radius: 28px;
      background: linear-gradient(160deg, rgba(232, 212, 139, 0.85) 0%, rgba(11, 122, 86, 0.55) 48%, rgba(201, 164, 74, 0.8) 100%);
      box-shadow:
        0 24px 60px rgba(6, 40, 30, 0.38),
        0 0 0 1px rgba(255, 255, 255, 0.25),
        0 0 48px rgba(11, 122, 86, 0.18);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 2px;
      background: linear-gradient(160deg, #f3e6b4, transparent 40%, transparent 60%, #d4af37);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.7;
    }

    .card-face {
      position: relative;
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.88) 0%, rgba(248, 252, 249, 0.78) 100%);
      backdrop-filter: blur(28px) saturate(1.35);
      -webkit-backdrop-filter: blur(28px) saturate(1.35);
      padding: 32px 28px 28px;
      overflow: hidden;
    }

    .card-face::after {
      content: "";
      position: absolute;
      top: -80px;
      left: 50%;
      width: 220px;
      height: 220px;
      margin-left: -110px;
      background: radial-gradient(circle, rgba(11, 122, 86, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-deep);
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .eyebrow::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .card-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 320px;
    }

    /* --- Loading --- */
    .loading-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .loading-wrap.hide {
      opacity: 0;
      transform: scale(0.97);
      pointer-events: none;
      position: absolute;
      inset: 0;
      visibility: hidden;
    }

    .scan-stage {
      position: relative;
      width: 148px;
      height: 148px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .ring-outer {
      border: 1px solid rgba(201, 164, 74, 0.35);
      box-shadow: 0 0 0 8px rgba(11, 122, 86, 0.05);
      animation: pulse-ring 2.4s ease-in-out infinite;
    }

    .ring-mid {
      inset: 14px;
      border: 1px dashed rgba(11, 122, 86, 0.28);
      animation: spin 18s linear infinite;
    }

    .scan-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .scan-track {
      fill: none;
      stroke: rgba(11, 122, 86, 0.12);
      stroke-width: 4;
    }

    .scan-progress {
      fill: none;
      stroke: url(#goldGreen);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 314;
      stroke-dashoffset: 314;
      transform: rotate(-90deg);
      transform-origin: 80px 80px;
      animation: fill-ring 8s linear forwards;
      filter: drop-shadow(0 0 6px rgba(201, 164, 74, 0.55));
    }

    .device-core {
      position: absolute;
      inset: 38px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 32%, #ffffff 0%, #edf8f3 55%, #d8efe4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 8px 20px rgba(11, 122, 86, 0.18);
    }

    .device-core svg {
      width: 34px;
      height: 34px;
    }

    .scan-beam {
      position: absolute;
      left: 44px;
      right: 44px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e8d48b, #0b7a56, #e8d48b, transparent);
      box-shadow: 0 0 10px rgba(232, 212, 139, 0.8);
      animation: beam 2.2s ease-in-out infinite;
      border-radius: 2px;
      z-index: 2;
      pointer-events: none;
    }

    .pct {
      margin-top: 4px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--emerald-deep);
      line-height: 1;
    }

    .pct-unit {
      font-family: "Outfit", sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold-deep);
      margin-left: 2px;
      vertical-align: super;
    }

    .loading-text {
      margin: 10px 0 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
      min-height: 20px;
    }

    .checks {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(11, 122, 86, 0.08);
      font-size: 13px;
      font-weight: 500;
      color: #8aa399;
      transition: color 0.35s ease, background 0.35s ease, border-color 0.35s ease;
    }

    .check-row.done {
      color: var(--emerald-deep);
      background: rgba(209, 250, 229, 0.45);
      border-color: rgba(11, 122, 86, 0.16);
    }

    .check-row.active {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(201, 164, 74, 0.4);
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #c5d5ce;
      background: #fff;
    }

    .check-row.active .dot {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 164, 74, 0.18);
    }

    .check-row.active .dot::after {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      animation: blink 1s ease-in-out infinite;
    }

    .check-row.done .dot {
      border-color: var(--emerald);
      background: var(--emerald);
    }

    .check-row.done .dot svg {
      display: block;
    }

    .dot svg {
      display: none;
      width: 10px;
      height: 10px;
    }

    /* --- Result --- */
    .result-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: opacity 0.5s ease 0.08s, transform 0.5s ease 0.08s;
    }

    .result-wrap.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .seal {
      position: relative;
      width: 92px;
      height: 92px;
      margin-bottom: 18px;
      animation: pop 0.5s cubic-bezier(0.22, 1.2, 0.36, 1);
    }

    .seal-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      box-shadow: 0 0 0 6px rgba(201, 164, 74, 0.12), 0 0 24px rgba(11, 122, 86, 0.2);
    }

    .seal-core {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: linear-gradient(180deg, #0f9a68 0%, #06704d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .seal-core svg {
      width: 36px;
      height: 36px;
    }

    .tick-path {
      stroke: #fff;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 28;
      stroke-dashoffset: 28;
      animation: draw 0.5s ease 0.22s forwards;
    }

    .status-kicker {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin-bottom: 8px;
    }

    .status-text {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--emerald-deep);
      max-width: 280px;
    }

    .status-sub {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.5;
      max-width: 260px;
    }

    .btn-register {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 280px;
      margin-top: 22px;
      padding: 15px 28px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #fff;
      background: linear-gradient(180deg, #1aa36f 0%, #0b7a56 100%);
      border: 1px solid rgba(232, 212, 139, 0.45);
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      box-shadow:
        0 8px 22px rgba(11, 122, 86, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-register:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow:
        0 12px 28px rgba(11, 122, 86, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .btn-register:active {
      transform: translateY(0);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fill-ring {
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.7; }
    }

    @keyframes beam {
      0%   { top: 48px; opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { top: 98px; opacity: 0; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes pop {
      0%   { transform: scale(0.55); opacity: 0; }
      70%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @media (max-width: 420px) {
      .card-face { padding: 28px 20px 22px; }
      .status-text { font-size: 22px; }
    }
  </style>
</head>
<body>

<img class="bg-video" src="image_2026-09-07_11-38-11.png" alt="">
  <div class="bg-overlay"></div>

  <div class="card">
    <div class="card-face">
      <p class="eyebrow">Sự kiện độc quyền</p>
      <div class="card-inner">

        <div class="loading-wrap" id="loading">
          <div class="scan-stage">
            <div class="ring ring-outer"></div>
            <div class="ring ring-mid"></div>
            <svg class="scan-svg" viewBox="0 0 160 160" aria-hidden="true">
              <defs>
                <linearGradient id="goldGreen" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#0b7a56"/>
                  <stop offset="50%" stop-color="#d4af37"/>
                  <stop offset="100%" stop-color="#0b7a56"/>
                </linearGradient>
              </defs>
              <circle class="scan-track" cx="80" cy="80" r="50"/>
              <circle class="scan-progress" cx="80" cy="80" r="50"/>
            </svg>
            <div class="scan-beam"></div>
            <div class="device-core">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="7" y="2" width="10" height="20" rx="2.2" stroke="#0b7a56" stroke-width="1.6"/>
                <line x1="10" y1="18.2" x2="14" y2="18.2" stroke="#c9a44a" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="12" cy="5.6" r="0.7" fill="#c9a44a"/>
              </svg>
            </div>
          </div>

          <p class="pct"><span id="pctNum">0</span><span class="pct-unit">%</span></p>
          <p class="loading-text" id="loadingText">Đang kết nối thiết bị…</p>

          <div class="checks" id="checks">
            <div class="check-row active" data-step="0">
              <span class="dot"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.4 2.4 4.6-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              Hệ điều hành
            </div>
            <div class="check-row" data-step="1">
              <span class="dot"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.4 2.4 4.6-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              Kết nối mạng
            </div>
            <div class="check-row" data-step="2">
              <span class="dot"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.4 2.4 4.6-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              Bảo mật thiết bị
            </div>
            <div class="check-row" data-step="3">
              <span class="dot"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.4 2.4 4.6-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              Điều kiện tham gia
            </div>
          </div>
        </div>

        <div class="result-wrap" id="result">
          <div class="seal">
            <div class="seal-ring"></div>
            <div class="seal-core">
              <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                <path d="M24 6L10 12v12c0 8.8 6.2 16.8 14 19.4C32.8 40.8 39 32.8 39 24V12L24 6z" stroke="#e8d48b" stroke-width="1.6" fill="none"/>
                <path class="tick-path" d="M17 24.5l5 5 9.5-10.5"/>
              </svg>
            </div>
          </div>
          <p class="status-kicker">Xác nhận thành công</p>
          <p class="status-text">Thiết bị đủ điều kiện</p>
          <p class="status-sub">Bạn đã được xác nhận tham gia sự kiện. Đăng ký ngay để giữ suất.</p>
          <a href="https://www.yg8ads01.xyz/?ch=b27302f09c" class="btn-register" id="btnRegister">ĐĂNG KÝ NGAY</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const LOADING_TIME = 8000;
    const REGISTER_URL = 'https://www.yg8ads01.xyz/?ch=b27302f09c';

    var labels = [
      'Đang kiểm tra hệ điều hành…',
      'Đang kiểm tra kết nối mạng…',
      'Đang quét bảo mật thiết bị…',
      'Đang đối chiếu điều kiện tham gia…'
    ];
    var rows = document.querySelectorAll('.check-row');
    var loadingText = document.getElementById('loadingText');
    var pctNum = document.getElementById('pctNum');
    var started = Date.now();

    var stepTimes = [0, 1800, 3800, 5800];
    stepTimes.forEach(function (t, i) {
      setTimeout(function () {
        rows.forEach(function (row, idx) {
          row.classList.remove('active');
          if (idx < i) row.classList.add('done');
          else if (idx === i) row.classList.add('active');
        });
        loadingText.textContent = labels[i];
      }, t);
    });

    var tick = setInterval(function () {
      var p = Math.min(100, Math.round(((Date.now() - started) / LOADING_TIME) * 100));
      pctNum.textContent = p;
      if (p >= 100) clearInterval(tick);
    }, 50);

    setTimeout(function () {
      rows.forEach(function (row) {
        row.classList.remove('active');
        row.classList.add('done');
      });
      pctNum.textContent = '100';
      document.getElementById('loading').classList.add('hide');
      document.getElementById('result').classList.add('show');
    }, LOADING_TIME);

    document.getElementById('btnRegister').addEventListener('click', function (e) {
      e.preventDefault();
      var url = this.getAttribute('href') || REGISTER_URL;
      var redirected = false;

      function goRegister() {
        if (redirected || !url || url === '#') return;
        redirected = true;
        window.location.href = url;
      }

      if (typeof fbq === 'function') {
        fbq('track', 'Lead', {}, { eventCallback: goRegister });
      }

      setTimeout(goRegister, 500);
    });
  </script>

</body>
</html>
